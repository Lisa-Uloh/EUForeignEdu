name: Build & Deploy (Firebase Hosting + Functions)

on:
  push:
    branches: [ main ]         # ← change if your default branch is different
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: eufes-c2567   # ← your Firebase/GCP project id

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root deps
        run: npm ci

      - name: Build web app
        run: npm run build
        # For Vite this runs "vite build" and outputs to "dist"

      # If you have Cloud Functions, install their deps too
      - name: Install functions deps (if present)
        if: hashFiles('functions/package.json') != ''
        run: |
          cd functions
          npm ci
          cd -

      # Deploy Hosting + Functions with your service account JSON
      - name: Deploy to Firebase (hosting + functions)
        uses: w9jds/firebase-action@v2.2.0
        with:
          args: deploy --project ${{ env.PROJECT_ID }} --only hosting,functions
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EUFES_C2567 }}
